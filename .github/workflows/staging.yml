name: Staging CI

# Runs on every push to the staging branch.
# Builds Release|x64, packages an MSI, and uploads it as a workflow artifact.
# Does NOT create a GitHub Release — that only happens when staging is merged to
# main and a version tag is pushed.
#
# To promote staging → main:
#   git checkout main
#   git merge staging --ff-only
#   git push origin main
# (or ask Claude to do it)

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main      # gate PRs from staging into main

permissions:
  contents: read

jobs:
  build:
    name: Build & Package (staging)
    runs-on: windows-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Toolchain ──────────────────────────────────────────────────────────
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET (for WiX CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install WiX v4
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global

      # ── 3. Build ──────────────────────────────────────────────────────────────
      - name: Build Release
        run: |
          msbuild GameLauncher.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /nologo `
            /p:TreatWarningsAsErrors=false

      # ── 4. Package MSI ────────────────────────────────────────────────────────
      - name: Create dist directory
        run: New-Item -ItemType Directory -Force dist

      - name: Build MSI
        run: |
          wix build installer\ArcadeLauncher.wxs `
            -ext WixToolset.UI.wixext `
            -d "BinDir=bin\Release" `
            -out "dist\ArcadeLauncher-x64.msi" `
            -arch x64

      # ── 5. Upload artifact (available in the Actions UI for 7 days) ───────────
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLauncher-staging-${{ github.sha }}
          retention-days: 7
          path: |
            dist\ArcadeLauncher-x64.msi
            bin\Release\ArcadeLauncher.exe
