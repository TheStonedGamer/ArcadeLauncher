name: Staging CI

# Compile-only gate — verifies the code builds on every push to staging.
# MSI packaging is handled locally via scripts/build.ps1.
# Production MSIs and GitHub Releases are created by promote.yml → release.yml.

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main      # gate PRs from staging into main

permissions:
  contents: read

jobs:
  build:
    name: Compile (Release|x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: |
          msbuild GameLauncher.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /nologo `
            /p:TreatWarningsAsErrors=false
