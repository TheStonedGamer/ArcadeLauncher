name: Release

# Triggered automatically by the promote.yml workflow when it pushes a version tag.
# Do NOT add a `branches:` filter here — tag and branch push filters are independent
# in GitHub Actions; adding branches would make this fire on every push to main.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build toolchain ────────────────────────────────────────────────────
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET (for WiX CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install WiX v4
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global

      # ── 3. Compile (Release|x64) ──────────────────────────────────────────────
      - name: Build Release
        run: |
          msbuild GameLauncher.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /nologo `
            /p:TreatWarningsAsErrors=false

      # ── 4. Package MSI ────────────────────────────────────────────────────────
      - name: Create dist directory
        run: New-Item -ItemType Directory -Force dist

      - name: Build MSI
        run: |
          $txt   = Get-Content src\Version.h -Raw
          $major = [regex]::Match($txt, '#define ARCADE_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor = [regex]::Match($txt, '#define ARCADE_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch = [regex]::Match($txt, '#define ARCADE_VERSION_PATCH\s+(\d+)').Groups[1].Value
          $ver   = "$major.$minor.$patch"
          Write-Host "Product version: $ver"
          wix build installer\ArcadeLauncher.wxs `
            -ext WixToolset.UI.wixext `
            -d "BinDir=bin\Release" `
            -d "ProductVersion=$ver" `
            -out "dist\ArcadeLauncher-x64.msi" `
            -arch x64

      # ── 5. Collect artifacts ──────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLauncher-${{ github.ref_name }}
          path: |
            dist\ArcadeLauncher-x64.msi
            bin\Release\ArcadeLauncher.exe

      # ── 6. Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArcadeLauncher ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ArcadeLauncher-x64.msi
            bin/Release/ArcadeLauncher.exe
