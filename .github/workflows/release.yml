name: Release

# Fires on every push to main (and on version tags for manual overrides).
# Automatically bumps the minor version on each push to main, unless the
# commit message contains [major] (bumps major) or the push was made by
# github-actions[bot] (version bump commit — skip to avoid infinite loop).
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to push the version bump commit

      # ── 2. Configure git identity ─────────────────────────────────────────────
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 3. Bump version (branch pushes only, not bot commits or tag pushes) ───
      - name: Bump version
        id: ver
        shell: pwsh
        run: |
          # If this push was the bot's own version-bump commit, skip bumping
          # (GITHUB_TOKEN pushes don't retrigger workflows, but tag-triggered
          # runs land here too and should also skip the bump).
          $author  = git log -1 --format='%an'
          $isTag   = '${{ github.ref_type }}' -eq 'tag'
          $isBot   = $author -eq 'github-actions[bot]'

          $txt     = Get-Content src\Version.h -Raw
          $major   = [int][regex]::Match($txt, '#define ARCADE_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor   = [int][regex]::Match($txt, '#define ARCADE_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch   = [int][regex]::Match($txt, '#define ARCADE_VERSION_PATCH\s+(\d+)').Groups[1].Value

          Write-Host "Current version : $major.$minor.$patch"
          Write-Host "Triggered by tag: $isTag   Bot commit: $isBot"

          if (-not $isTag -and -not $isBot) {
            # Determine bump type from commit message
            $msg = git log -1 --format='%s'
            Write-Host "Commit message  : $msg"
            if ($msg -match '\[major\]') {
              $major++; $minor = 0; $patch = 0
              Write-Host "Bump type       : MAJOR"
            } elseif ($msg -match '\[minor\]') {
              $minor++; $patch = 0
              Write-Host "Bump type       : MINOR"
            } else {
              $patch++
              Write-Host "Bump type       : PATCH"
            }

            # Rewrite Version.h
            $txt = $txt -replace '(#define ARCADE_VERSION_MAJOR\s+)\d+', "`${1}$major"
            $txt = $txt -replace '(#define ARCADE_VERSION_MINOR\s+)\d+', "`${1}$minor"
            $txt = $txt -replace '(#define ARCADE_VERSION_PATCH\s+)\d+', "`${1}$patch"
            $txt = $txt -replace '(#define ARCADE_VERSION_BUILD\s+)\d+', "`${1}0"
            Set-Content src\Version.h $txt -NoNewline

            # Commit and push — GITHUB_TOKEN commits do NOT retrigger workflows
            git add src/Version.h
            git commit -m "chore: bump version to $major.$minor.$patch [skip actions]"
            git push origin main
          }

          $ver = "$major.$minor.$patch"
          $tag = "v$ver"
          Write-Host "Release version : $ver   Tag: $tag"
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "TAG=$tag"     >> $env:GITHUB_OUTPUT

      # ── 4. Build toolchain ────────────────────────────────────────────────────
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET (for WiX CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install WiX v4
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global

      # ── 5. Compile (Release|x64) ──────────────────────────────────────────────
      - name: Build Release
        run: |
          msbuild GameLauncher.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /nologo `
            /p:TreatWarningsAsErrors=false

      # ── 6. Package MSI ────────────────────────────────────────────────────────
      - name: Create dist directory
        run: New-Item -ItemType Directory -Force dist

      - name: Build MSI
        run: |
          wix build installer\ArcadeLauncher.wxs `
            -ext WixToolset.UI.wixext `
            -d "BinDir=bin\Release" `
            -d "ProductVersion=${{ steps.ver.outputs.VERSION }}" `
            -out "dist\ArcadeLauncher-x64.msi" `
            -arch x64

      # ── 7. Collect artifacts ──────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLauncher-${{ steps.ver.outputs.TAG }}
          path: |
            dist\ArcadeLauncher-x64.msi
            bin\Release\ArcadeLauncher.exe

      # ── 8. Create / update GitHub Release ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: ArcadeLauncher ${{ steps.ver.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ArcadeLauncher-x64.msi
            bin/Release/ArcadeLauncher.exe
